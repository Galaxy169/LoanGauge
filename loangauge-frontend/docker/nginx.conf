# Serves the built Vite/React SPA. Two things matter most here for a React
# Router app: the try_files fallback to index.html (so refreshing on e.g.
# /assessments/42 doesn't 404 against a file that doesn't exist on disk),
# and never caching env-config.js (it's regenerated per container start).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ALB target group health check — deliberately has zero app logic so it
    # can't fail for reasons unrelated to "is the container up."
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Regenerated by docker/entrypoint.sh on every container start — a CDN
    # or browser caching this would pin the container to whatever
    # environment first served it.
    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # Vite fingerprints build output filenames (content hash in the name),
    # so these are safe to cache aggressively — a new deploy gets new
    # filenames, not new content behind the same URL.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any path that isn't a real static file is a client-side
    # route owned by React Router, so hand it index.html and let the app
    # resolve it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
