name: loangauge

services:
  mysql:
    image: mysql:9.5
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: loangauge
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [loangauge-net]

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [loangauge-net]

  eureka-server:
    build: ./loangauge-backend/eureka-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [loangauge-net]

  auth-service:
    build: ./loangauge-backend/auth-service
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      EUREKA_URI: http://eureka-server:8761/eureka/
      FRONTEND_RESET_PASSWORD_URL: ${FRONTEND_RESET_PASSWORD_URL}
    networks: [loangauge-net]

  financial-service:
    build: ./loangauge-backend/financial-service
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MONGODB_URI: ${MONGODB_URI}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_URI: http://eureka-server:8761/eureka
    networks: [loangauge-net]

  notification-service:
    build: ./loangauge-backend/notification-service
    restart: unless-stopped
    depends_on:
      rabbitmq: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      MONGODB_URI: ${MONGODB_URI}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      EUREKA_URI: http://eureka-server:8761/eureka
    networks: [loangauge-net]

  gateway:
    build: ./loangauge-backend/gateway
    restart: unless-stopped
    depends_on:
      eureka-server: { condition: service_healthy }
      auth-service: { condition: service_started }
      financial-service: { condition: service_started }
      notification-service: { condition: service_started }
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "8080:8080"
    networks: [loangauge-net]

  frontend:
    build:
      context: ./loangauge-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      API_BASE_URL: ${API_BASE_URL}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
    ports:
      - "80:80"
    networks: [loangauge-net]

networks:
  loangauge-net:
    driver: bridge

volumes:
  mysql-data: